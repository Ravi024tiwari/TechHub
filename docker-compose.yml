services:
  # ==========================================
  # 1. Backend Service (Node.js API)
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: techhub-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - PORT=5000
      - NODE_ENV=production
    ports:
      # Exposes 5000 to host machine for direct API testing / Postman (optional)
      - "5000:5000"
    networks:
      - techhub-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ==========================================
  # 2. Frontend Service (React + Nginx)
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=/api/v1
    container_name: techhub-frontend
    restart: unless-stopped
    ports:
      # Maps port 80 of Nginx to port 3000 on your host machine
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - techhub-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 3s
      retries: 3

networks:
  techhub-network:
    driver: bridge
